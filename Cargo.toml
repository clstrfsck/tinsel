[package]
name = "tinsel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
ariadne = "0.6.0"
cranelift-codegen = "0.138.0"
cranelift-frontend = "0.138.0"
cranelift-jit = "0.138.0"
cranelift-module = "0.138.0"
imbl = "7.0.2"
logos = "0.16.1"
md5 = "0.8.1"
mimalloc = "0.1.52"
num-bigint = "0.5.1"
stacker = "0.1.25"

[[test]]
name = "run_tin"
path = "tests/run_tin.rs"
harness = false

[profile.dev]
# Light optimisation keeps the evaluator's stack frames small, so deep
# recursion in the tests (SPEC 8.2) doesn't need gigabytes of stack.
opt-level = 1

[profile.release]
# Whole-program optimisation: about 3% faster on the slow solutions, at the
# cost of a slower release build (about 15 s).
lto = "fat"
codegen-units = 1
# No unwinding: 2% to 14% faster on the slow solutions (`TIMINGS.md`). A
# panic is an interpreter bug, and nothing in a release build catches one;
# it still prints its message, then aborts. Tests use the dev profile, so
# the harness can still contain a panic in one file.
panic = "abort"
